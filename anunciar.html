<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anunciar na Vitrine Armazém</title>
<meta name="description" content="Cadastre seus tratores, implementos e peças na Vitrine Armazém, o classificado do agro.">
<style>
  :root { --fundo:#F4F6F8; --cartao:#ffffff; --texto:#1D2329; --sec:#5B6570; --linha:#D9DEE3; --azul:#0E4D8A; --verde:#1F7A3A; --erro:#C0392B; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo:#121417; --cartao:#1E2226; --texto:#E8EAED; --sec:#9AA3AB; --linha:#33393F; --azul:#5B9BD9; --verde:#2E9E52; --erro:#E57368; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); font-family:Arial, sans-serif; }
  .topo { background:#0E4D8A; color:#fff; padding:16px; }
  .topo h1 { margin:0; font-size:20px; }
  .topo p { margin:4px 0 0; font-size:14px; opacity:.9; }
  .box { max-width:560px; margin:0 auto; padding:12px; }
  .voltar { display:inline-block; margin:4px 0 8px; color:var(--sec); text-decoration:none; font-size:15px; }
  .cartao { background:var(--cartao); border:1px solid var(--linha); border-radius:12px; padding:14px; margin-bottom:12px; }
  .cartao h2 { margin:0 0 10px; font-size:17px; color:var(--azul); display:flex; justify-content:space-between; align-items:center; }
  label { display:block; font-size:14px; margin:10px 0 4px; }
  label small { color:var(--sec); }
  input, select, textarea { width:100%; padding:11px; border:1px solid var(--linha); border-radius:8px; font-size:16px;
    background:var(--cartao); color:var(--texto); font-family:inherit; }
  textarea { min-height:70px; }
  .dupla { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .dupla label { margin-top:10px; }
  .remover { background:none; border:0; color:var(--erro); font-size:14px; cursor:pointer; }
  .fotos { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .fotos img { width:80px; height:80px; object-fit:cover; border-radius:8px; border:1px solid var(--linha); }
  .btfoto { display:inline-block; padding:10px 14px; border:1px dashed var(--azul); color:var(--azul); border-radius:8px; cursor:pointer; font-size:15px; }
  .btfoto input { display:none; }
  .bt { width:100%; padding:15px; border-radius:10px; font-size:17px; cursor:pointer; border:0; }
  .bt.add { background:transparent; border:1px solid var(--azul); color:var(--azul); margin-bottom:12px; }
  .bt.enviar { background:var(--verde); color:#fff; }
  .bt:disabled { opacity:.6; }
  .msg { text-align:center; font-size:15px; margin:12px 0; }
  .msg.erro { color:var(--erro); }
  .ok { text-align:center; padding:24px 12px; }
  .ok h2 { color:var(--verde); }
  .armadilha { position:absolute; left:-9999px; }
</style>
</head>
<body>
<div class="topo">
  <h1>Anunciar na Vitrine Armazém</h1>
  <p>Cadastre um ou vários equipamentos de uma vez.</p>
</div>

<div class="box" id="tela">
  <a class="voltar" href="/">← Voltar à vitrine</a>

  <div class="cartao">
    <h2>Seus dados</h2>
    <label>Seu nome</label>
    <input id="vNome" autocomplete="name">
    <label>Seu WhatsApp (com DDD)</label>
    <input id="vTel" type="tel" inputmode="tel" placeholder="(17) 99999-9999" autocomplete="tel">
    <label>Sua cidade / região</label>
    <input id="vCidade">
    <label>Você é</label>
    <select id="vTipo">
      <option>Dono do equipamento</option>
      <option>Parceiro (corretor ou revenda)</option>
    </select>
    <label>Como conheceu a Vitrine?</label>
    <select id="vComo">
      <option value="">Selecione</option>
      <option>Rádio</option><option>Instagram</option><option>Facebook</option><option>Google</option>
      <option>WhatsApp</option><option>Indicação</option><option>Já sou cliente</option><option>Outro</option>
    </select>
    <input class="armadilha" id="site" tabindex="-1" autocomplete="off">
  </div>

  <div id="itens"></div>

  <button class="bt add" id="btAdd" type="button">+ Adicionar outro equipamento</button>
  <button class="bt enviar" id="btEnviar" type="button">Enviar para análise</button>
  <p class="msg" id="msg"></p>
  <p style="font-size:13px;color:var(--sec);text-align:center">Seu anúncio passa por uma análise rápida antes de aparecer na vitrine.</p>
</div>

<script>
  const API = 'https://script.google.com/macros/s/AKfycbzX6TfdgbSE6N6R-M7saDM5BScIjwjVEjWdaNIK5jP4ZJbDtTA94IgqaYWDQddXPmjM/exec';
  const CHAVE = 'anunciar_vendedor';
  let categorias = [];
  let contador = 0;
  const fotosPorItem = {}; // id -> [{tipo,b64,url}]

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  // ---------- Dados do vendedor: link personalizado (?nome=&tel=&cidade=&tipo=parceiro) ou memória do navegador ----------
  function carregarVendedor() {
    let v = {};
    try { v = JSON.parse(localStorage.getItem(CHAVE) || '{}'); } catch (e) {}
    const q = new URLSearchParams(location.search);
    if (q.get('nome')) v.nome = q.get('nome');
    if (q.get('tel')) v.tel = q.get('tel');
    if (q.get('cidade')) v.cidade = q.get('cidade');
    if (q.get('tipo') === 'parceiro') v.tipo = 'Parceiro (corretor ou revenda)';
    document.getElementById('vNome').value = v.nome || '';
    document.getElementById('vTel').value = v.tel || '';
    document.getElementById('vCidade').value = v.cidade || '';
    if (v.tipo) document.getElementById('vTipo').value = v.tipo;
    if (v.comoConheceu) document.getElementById('vComo').value = v.comoConheceu;
  }
  function lerVendedor() {
    return {
      nome: document.getElementById('vNome').value.trim(),
      tel: document.getElementById('vTel').value.trim(),
      cidade: document.getElementById('vCidade').value.trim(),
      tipo: document.getElementById('vTipo').value,
      comoConheceu: document.getElementById('vComo').value
    };
  }

  // ---------- Equipamentos ----------
  function opcoesCategoria() {
    return '<option value="">Selecione</option>' + categorias.map(c => '<option>' + esc(c.nome) + '</option>').join('');
  }
  function usaHorimetro(nome) {
    const c = categorias.find(x => x.nome === nome);
    return c ? c.horimetro : /trator|colhe|pulveriz.*auto/i.test(nome || '');
  }

  function adicionarItem() {
    const id = ++contador;
    fotosPorItem[id] = [];
    const div = document.createElement('div');
    div.className = 'cartao';
    div.id = 'item' + id;
    div.innerHTML =
      '<h2><span class="titItem"></span><button class="remover" type="button" onclick="removerItem(' + id + ')">Remover</button></h2>' +
      '<div class="dupla"><div><label>Categoria</label><select class="cat">' + opcoesCategoria() + '</select></div>' +
      '<div><label>Novo ou usado</label><select class="cond"><option value="">Selecione</option><option>Novo</option><option>Usado</option></select></div></div>' +
      '<label>Marca</label><input class="marca" placeholder="Ex.: Baldan, Jacto, New Holland">' +
      '<label>Descrição <small>(o que é, modelo, medidas)</small></label><input class="desc" placeholder="Ex.: Grade aradora 16 discos 28 pol">' +
      '<div class="dupla"><div><label>Ano</label><input class="ano" inputmode="numeric" placeholder="Ex.: 2018"></div>' +
      '<div><label>Quantidade</label><input class="qtd" inputmode="numeric" value="1"></div></div>' +
      '<div class="campoHor" style="display:none"><label>Horímetro (horas)</label><input class="hor" inputmode="numeric"></div>' +
      '<label>Estado de conservação</label><select class="estado"><option value="">Selecione</option><option>Novo</option><option>Semi novo</option><option>Bom</option><option>Usado</option><option>Precisa de reforma</option></select>' +
      '<div class="dupla"><div><label>Valor para a vitrine (R$)</label><input class="valor" inputmode="decimal"></div>' +
      '<div><label>Menor valor aceito (R$) <small>não aparece no site</small></label><input class="menor" inputmode="decimal"></div></div>' +
      '<label>Cidade onde a máquina está <small>(se for diferente da sua)</small></label><input class="regiao">' +
      '<label>Fotos <small>(até 3)</small></label>' +
      '<div class="fotos"></div>' +
      '<label class="btfoto">📷 Adicionar fotos<input type="file" accept="image/*" multiple></label>' +
      '<label>Observações <small>(opcional)</small></label><textarea class="obs"></textarea>';
    document.getElementById('itens').appendChild(div);

    div.querySelector('.cat').addEventListener('change', e => {
      div.querySelector('.campoHor').style.display = usaHorimetro(e.target.value) ? 'block' : 'none';
    });
    div.querySelector('input[type=file]').addEventListener('change', e => adicionarFotos(id, e.target.files, e.target));
    numerarItens();
    if (id > 1) div.scrollIntoView({ behavior: 'smooth' });
  }

  function removerItem(id) {
    if (document.querySelectorAll('#itens .cartao').length === 1) return;
    document.getElementById('item' + id).remove();
    delete fotosPorItem[id];
    numerarItens();
  }
  function numerarItens() {
    const cards = document.querySelectorAll('#itens .cartao');
    cards.forEach((c, i) => {
      c.querySelector('.titItem').textContent = 'Equipamento ' + (i + 1);
      c.querySelector('.remover').style.display = cards.length > 1 ? 'inline' : 'none';
    });
  }

  // ---------- Fotos: reduz no próprio celular antes de enviar ----------
  function reduzir(arquivo) {
    return new Promise((ok, falha) => {
      const img = new Image();
      img.onload = () => {
        const max = 1280, esc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.8);
        URL.revokeObjectURL(img.src);
        ok({ tipo: 'image/jpeg', b64: url.split(',')[1], url: url });
      };
      img.onerror = falha;
      img.src = URL.createObjectURL(arquivo);
    });
  }
  async function adicionarFotos(id, arquivos, input) {
    const lista = fotosPorItem[id];
    for (const a of Array.from(arquivos)) {
      if (lista.length >= 3) break;
      try { lista.push(await reduzir(a)); } catch (e) {}
    }
    input.value = '';
    const area = document.querySelector('#item' + id + ' .fotos');
    area.innerHTML = lista.map((f, k) => '<img src="' + f.url + '" alt="Foto ' + (k + 1) + '" title="Toque para remover" onclick="removerFoto(' + id + ',' + k + ')">').join('');
  }
  function removerFoto(id, k) {
    fotosPorItem[id].splice(k, 1);
    const area = document.querySelector('#item' + id + ' .fotos');
    area.innerHTML = fotosPorItem[id].map((f, j) => '<img src="' + f.url + '" alt="Foto ' + (j + 1) + '" onclick="removerFoto(' + id + ',' + j + ')">').join('');
  }

  // ---------- Envio ----------
  function erro(t) { const m = document.getElementById('msg'); m.className = 'msg erro'; m.textContent = t; }

  async function enviar() {
    const vend = lerVendedor();
    if (!vend.nome || vend.tel.replace(/\D/g, '').length < 10) return erro('Preencha seu nome e o WhatsApp com DDD.');
    const itens = [];
    for (const card of document.querySelectorAll('#itens .cartao')) {
      const id = Number(card.id.replace('item', ''));
      const g = cl => card.querySelector('.' + cl).value.trim();
      const titulo = card.querySelector('.titItem').textContent;
      if (!g('cat') || !g('cond') || !g('desc') || !g('valor')) return erro(titulo + ': preencha categoria, novo ou usado, descrição e valor.');
      if (!fotosPorItem[id].length) return erro(titulo + ': adicione pelo menos uma foto.');
      itens.push({
        categoria: g('cat'), condicao: g('cond'), marca: g('marca'), descricao: g('desc'),
        ano: g('ano'), quantidade: g('qtd'), horimetro: g('hor'), estado: g('estado'),
        valor: g('valor'), menorValor: g('menor'), regiao: g('regiao'), obs: g('obs'),
        fotos: fotosPorItem[id].map(f => ({ tipo: f.tipo, b64: f.b64 }))
      });
    }
    try { localStorage.setItem(CHAVE, JSON.stringify(vend)); } catch (e) {}

    const bt = document.getElementById('btEnviar');
    bt.disabled = true; bt.textContent = 'Enviando… não feche a página';
    document.getElementById('msg').textContent = '';
    try {
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ acao: 'anunciar', vendedor: vend, itens: itens, site: document.getElementById('site').value })
      });
      const res = await r.json();
      if (!res.ok) throw new Error(res.erro || 'erro');
      document.getElementById('tela').innerHTML =
        '<div class="cartao ok"><h2>✅ Recebido!</h2>' +
        '<p>' + itens.length + (itens.length > 1 ? ' equipamentos enviados' : ' equipamento enviado') + ' para análise.<br>Em breve ' + (itens.length > 1 ? 'eles aparecem' : 'ele aparece') + ' na vitrine.</p>' +
        '<button class="bt enviar" onclick="location.reload()">Cadastrar mais equipamentos</button>' +
        '<p><a class="voltar" href="/">← Voltar à vitrine</a></p></div>';
      window.scrollTo(0, 0);
    } catch (e) {
      bt.disabled = false; bt.textContent = 'Enviar para análise';
      erro('Não consegui enviar (' + e.message + '). Confira a internet e tente de novo.');
    }
  }

  // ---------- Início ----------
  document.getElementById('btAdd').addEventListener('click', adicionarItem);
  document.getElementById('btEnviar').addEventListener('click', enviar);
  carregarVendedor();
  fetch(API + '?acao=listasAnunciar', { credentials: 'omit' })
    .then(r => r.json()).then(d => { categorias = d.categorias || []; })
    .catch(() => {})
    .finally(() => adicionarItem());
</script>
</body>
</html>
